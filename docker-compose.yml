services:
  green-oaks-bot:
    build: .
    image: ghcr.io/tznkai/green-oaks-bot:latest
    restart: unless-stopped
    env_file: .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/home/container/data
